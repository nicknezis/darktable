name: ORT download probe
on:
  push:
    branches: [ci-onnxruntime-download-probe]
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git clone -q -b nightly-appimage-onnxruntime-nuget --depth 1 https://github.com/${{ github.repository }} src
      - name: extract fetch step
        run: |
          python3 - <<'PY'
          import yaml
          w=yaml.safe_load(open('src/.github/workflows/nightly.yml'))
          for j in w['jobs'].values():
            for s in j.get('steps',[]):
              if s.get('name')=='Fetch ONNX Runtime':
                open('fetch.sh','w').write(s['run'].replace('$'+'{{ runner.arch }}','$'+'{RUNNER_ARCH}')); break
          PY
          cat fetch.sh
      - run: bash -e fetch.sh
      - name: configure with FindONNXRuntime
        run: |
          mkdir t && ln -s $GITHUB_WORKSPACE/src/src t/src && cd t
          cat > CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.18)
          project(t C)
          set(CMAKE_SOURCE_DIR_SAVE ${CMAKE_SOURCE_DIR})
          list(APPEND CMAKE_MODULE_PATH ${SRC}/cmake/modules)
          find_package(ONNXRuntime REQUIRED)
          message(STATUS "found=${ONNXRuntime_FOUND} lib=${ONNXRuntime_LIBRARIES} libdir=${ONNXRuntime_LIB_DIR} inc=${ONNXRuntime_INCLUDE_DIRS}")
          CM
          cmake -S . -B b -DSRC=$GITHUB_WORKSPACE/src 2>&1 | tail -20
